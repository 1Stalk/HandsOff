name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release trigger
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout CMakeLists.txt
        uses: actions/checkout@v4
        with:
          sparse-checkout: CMakeLists.txt
          sparse-checkout-cone-mode: false

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $shouldRelease = "false"
          $tag = ""

          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $tag = $env:INPUT_TAG.Trim()
            $shouldRelease = "true"
          } elseif ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME.Trim()
            $shouldRelease = "true"
          } elseif ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "branch" -and $env:REF_NAME -eq "main") {
            $cmake = Get-Content -Path "CMakeLists.txt" -Raw
            if ($cmake -match 'project\(\s*HandsOff\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)') {
              $tag = "v$($Matches[1])"
              $existing = git ls-remote --tags origin "refs/tags/$tag"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ([string]::IsNullOrWhiteSpace($existing)) {
                $shouldRelease = "true"
                Write-Host "New version detected in CMakeLists.txt: $tag"
              } else {
                Write-Host "Tag $tag already exists on origin; skipping release."
              }
            }
          }

          if ($shouldRelease -eq "true" -and ([string]::IsNullOrWhiteSpace($tag) -or ($tag -notmatch '^[A-Za-z0-9._-]+$'))) {
            throw "Invalid release tag: '$tag'"
          }

          "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  release:
    name: Build & Publish Windows x64 Release
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build (Release x64, /W4 /WX)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vsNinja = Get-ChildItem "C:\Program Files*\Microsoft Visual Studio\*\*\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja\ninja.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($vsNinja) {
              $env:PATH = "$($vsNinja.DirectoryName);$env:PATH"
            }
          }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHANDSOFF_WERROR=ON -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path "HandsOff.exe") -or -not (Test-Path "HandsOff.dll")) {
            throw "Expected output binaries HandsOff.exe / HandsOff.dll were not produced."
          }

      - name: Run CTest, export & static-CRT checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir build --output-on-failure --no-tests=error
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $exports = dumpbin /exports HandsOff.dll | Out-String
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($sym in @("DllCanUnloadNow", "DllGetClassObject", "DllRegisterServer", "DllUnregisterServer", "HandsOffInitializeHook", "HandsOffRemoveHook")) {
            if ($exports -notmatch "\b$sym\b") {
              throw "Missing expected export '$sym' in HandsOff.dll"
            }
          }

          foreach ($bin in @("HandsOff.exe", "HandsOff.dll")) {
            $deps = dumpbin /dependents $bin | Out-String
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if ($deps -match "(VCRUNTIME140|MSVCP140)") {
              throw "$bin must link CRT statically (/MT) without dynamic VCRUNTIME140/MSVCP140 dependency:`n$deps"
            }
          }

          $scanOutput = & .\HandsOff.exe scan .\README.md | Out-String
          Write-Host $scanOutput
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package release archive & checksums
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $distDir = "dist\HandsOff-$tag-win-x64"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          Copy-Item "HandsOff.exe", "HandsOff.dll", "README.md", "LICENSE" -Destination $distDir

          $zipPath = "dist\HandsOff-$tag-win-x64.zip"
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipPath -Force

          $hashes = @("HandsOff.exe", "HandsOff.dll", $zipPath) | ForEach-Object {
            $h = Get-FileHash $_ -Algorithm SHA256
            "$($h.Hash.ToLowerInvariant())  $(Split-Path $_ -Leaf)"
          }
          $hashes | Out-File -FilePath "dist\SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist\SHA256SUMS.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandsOff-${{ needs.check.outputs.tag }}-win-x64
          path: |
            dist/HandsOff-${{ needs.check.outputs.tag }}-win-x64.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HandsOff ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/HandsOff-${{ needs.check.outputs.tag }}-win-x64.zip
            dist/SHA256SUMS.txt
